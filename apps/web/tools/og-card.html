<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #05090a;
    font-family: "Helvetica Neue", Inter, Arial, sans-serif;
    color: #e9f6f1;
    --phosphor: #86fadd;
    --signal: #ff5b82;
    --mono: "SFMono-Regular", "IBM Plex Mono", Menlo, Consolas, monospace;
  }
  .scene { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .vignette {
    position: absolute; inset: 0;
    background:
      linear-gradient(96deg, rgba(5,9,10,.94) 0%, rgba(5,9,10,.82) 26%, rgba(5,9,10,.3) 46%, transparent 60%),
      radial-gradient(128% 104% at 66% 46%, transparent 42%, rgba(5,9,10,.88) 100%);
  }
  .copy { position: absolute; top: 84px; left: 84px; width: 640px; }
  .mark { display: flex; align-items: center; gap: 19px; margin-bottom: 54px; }
  .glyph { position: relative; width: 58px; height: 58px; transform: rotate(-8deg); }
  .glyph i {
    position: absolute; inset: 3px 15px;
    border: 1.5px solid var(--phosphor);
    background: rgba(134,250,221,.05);
    transform: skewY(-27deg);
    box-shadow: 0 0 18px rgba(134,250,221,.22);
  }
  .glyph i:nth-child(2) { transform: translate(9px, 6px) skewY(-27deg); opacity: .62; }
  .glyph i:nth-child(3) { transform: translate(18px, 12px) skewY(-27deg); opacity: .3; }
  .wordmark strong { display: block; font: 800 27px/1 var(--mono); letter-spacing: .19em; }
  .wordmark small { display: block; margin-top: 6px; color: #8fada6; font: 600 12px/1 var(--mono); letter-spacing: .19em; }
  /* longhands: the font shorthand takes a family list, not the CSS-wide keyword inherit */
  h1 { font-size: 114px; font-weight: 700; line-height: .93; letter-spacing: -.05em; }
  h1 em { display: block; font-style: normal; color: var(--phosphor); }
  p.sub { margin-top: 34px; max-width: 600px; color: #b7cbc5; font-size: 31px; line-height: 1.4; letter-spacing: -.01em; }
  /* one sentence per line — left to wrap, it breaks mid-sentence */
  p.sub span { display: block; }
  .edge { position: absolute; inset: 0; border-top: 3px solid var(--signal); }
</style></head><body>
