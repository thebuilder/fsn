[package]
name = "fsn-desktop"
version = "0.1.0"
description = "FSN desktop application"
authors = ["FSN contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fsn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-fs = "=2.5.1"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-persisted-scope = "=2.3.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
