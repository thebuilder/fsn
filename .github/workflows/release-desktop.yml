name: Release desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-macos:
    name: Release macOS (Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: pnpm validate:desktop-release "${{ github.ref_name }}"

      - name: Check workspace
        run: pnpm check

      - name: Check native backend
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: FSN ${{ github.ref_name }}
          releaseBody: |
            > Preview build: this macOS application is currently unsigned and not notarized. macOS may block it or require manual approval under System Settings > Privacy & Security.

            This preview currently supports Apple Silicon Macs.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: true
          args: --target aarch64-apple-darwin --bundles app,dmg

  release-windows-experimental:
    name: Release Windows (experimental)
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: pnpm validate:desktop-release "${{ github.ref_name }}"

      - name: Check workspace
        run: pnpm check

      - name: Check native backend
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: FSN ${{ github.ref_name }}
          releaseBody: |
            > Experimental build: this Windows build is compile-tested by CI only. It is unsigned and has not had a Windows-specific security review or QA pass. See docs/RELEASING.md for known gaps.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: true

  release-linux-experimental:
    name: Release Linux (experimental)
    runs-on: ubuntu-22.04
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Linux build dependencies
        # Package list per https://v2.tauri.app/start/prerequisites/ (Linux > Debian)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: pnpm validate:desktop-release "${{ github.ref_name }}"

      - name: Check workspace
        run: pnpm check

      - name: Check native backend
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: FSN ${{ github.ref_name }}
          releaseBody: |
            > Experimental build: this Linux build is compile-tested by CI only. It is unsigned and has not had a Linux-specific security review or QA pass. See docs/RELEASING.md for known gaps.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: true
