<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #05090a;
    font-family: "Helvetica Neue", Inter, Arial, sans-serif;
    color: #e9f6f1;
    --phosphor: #86fadd;
    --signal: #ff5b82;
    --mono: "SFMono-Regular", "IBM Plex Mono", Menlo, Consolas, monospace;
  }
  .floor {
    position: absolute; inset: 46% -40% -34% -40%;
    background-image:
      linear-gradient(rgba(91,255,217,.26) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,255,217,.26) 1px, transparent 1px);
    background-size: 68px 68px;
    transform: perspective(560px) rotateX(69deg);
    transform-origin: 50% 0;
    -webkit-mask-image: linear-gradient(#000 8%, transparent 78%);
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 30% 45%, transparent 35%, rgba(5,9,10,.86) 100%);
  }
  .copy { position: absolute; top: 104px; left: 92px; width: 560px; }
  .mark { display: flex; align-items: center; gap: 18px; margin-bottom: 46px; }
  .glyph { position: relative; width: 54px; height: 54px; transform: rotate(-8deg); }
  .glyph i {
    position: absolute; inset: 3px 14px;
    border: 1.5px solid var(--phosphor);
    background: rgba(134,250,221,.05);
    transform: skewY(-27deg);
    box-shadow: 0 0 18px rgba(134,250,221,.22);
  }
  .glyph i:nth-child(2) { transform: translate(8px, 6px) skewY(-27deg); opacity: .62; }
  .glyph i:nth-child(3) { transform: translate(16px, 12px) skewY(-27deg); opacity: .3; }
  .wordmark strong { display: block; font: 800 25px/1 var(--mono); letter-spacing: .19em; }
  .wordmark small { display: block; margin-top: 5px; color: #87a39d; font: 600 11px/1 var(--mono); letter-spacing: .19em; }
  h1 { font: 550 88px/.94 inherit; letter-spacing: -.045em; }
  h1 em { display: block; font-style: normal; color: var(--phosphor); }
  p.sub { margin-top: 30px; max-width: 480px; color: #a8bbb5; font-size: 22px; line-height: 1.45; }
  .foot {
    position: absolute; left: 92px; bottom: 74px;
    display: flex; align-items: center; gap: 12px;
    color: #7f9a93; font: 650 12.5px var(--mono); letter-spacing: .15em;
  }
  .foot i { width: 7px; height: 7px; border-radius: 50%; background: var(--phosphor); box-shadow: 0 0 10px var(--phosphor); }
  .art { position: absolute; top: 52%; right: 8px; width: 690px; transform: translateY(-50%); }
  .art svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 26px 34px rgba(0,0,0,.6)); }
  .scan {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,0,0,.10) 3px 4px);
  }
  .edge { position: absolute; inset: 0; border-top: 3px solid var(--signal); }
